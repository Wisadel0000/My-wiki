[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiencoder"
version = "0.1.0.dev0"
description = "纯文本 wiki 框架：约定标记语法 + 结构化编辑工具 + HTML 渲染"
requires-python = ">=3.11"           # 用 tomllib / X | None 语法
dependencies = [
    "markdown-it-py>=3.0.0",         # CommonMark 渲染引擎（html=False 默认安全）
    "mdit-py-plugins>=0.4.0",        # dollarmath / attrs / footnote 等插件
    "jinja2>=3.1.2",                 # 整页模板，支持用户覆盖主题
]

[project.optional-dependencies]
# 中文增强：拼音 slug 自动生成 + 分词检索（v1 非必需，装了就自动启用）
cjk = [
    "pypinyin>=0.51.0",
    "jieba>=0.42.1",
]
# 代码块高亮
highlight = [
    "pygments>=2.17.0",
]
# 仅当开启"允许原始 HTML"时需要消毒
sanitize = [
    "nh3>=0.2.17",
]
# 预留：serve --watch 热重载（v1 不含本地服务）
preview = [
    "watchdog>=4.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
wikiencoder = "wikiencoder.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wikiencoder*"]

[tool.setuptools.package-data]
wikiencoder = ["assets/*.css", "assets/*.html", "spec/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
# 别扫进构建/缓存目录：.uv-cache 里是 uv 解包的依赖源码，out/ 是导出产物
extend-exclude = [".uv-cache", "out", "site", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文全角标点 / 中文标识符不是问题，关掉"歧义字符"类规则
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wikiencoder"]
